<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" viewBox="0 0 1600 1200" role="img" aria-labelledby="title desc">
  <title id="title">Machine Learning for Earth Modeling</title>
  <desc id="desc">Decorative cover image for the ECMWF learning activity card.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="45%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#1f2937"/>
    </linearGradient>
    <radialGradient id="glowA" cx="20%" cy="25%" r="45%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="82%" cy="80%" r="42%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#ffffff" stroke-opacity="0.07"/>
    </pattern>
  </defs>

  <rect width="1600" height="1200" fill="url(#bg)"/>
  <rect width="1600" height="1200" fill="url(#grid)"/>
  <rect width="1600" height="1200" fill="url(#glowA)"/>
  <rect width="1600" height="1200" fill="url(#glowB)"/>

  <g fill="none" stroke="#67e8f9" stroke-opacity="0.35" stroke-width="2">
    <circle cx="350" cy="320" r="140"/>
    <circle cx="1220" cy="860" r="220"/>
    <path d="M 200 860 C 420 710, 630 960, 930 770"/>
    <path d="M 620 280 C 860 120, 1120 330, 1380 180"/>
  </g>

  <g fill="#f8fafc" font-family="Inter, Segoe UI, Arial, sans-serif">
    <text x="110" y="900" font-size="34" opacity="0.8">ECMWF</text>
    <text x="110" y="980" font-size="78" font-weight="700">Machine Learning for</text>
    <text x="110" y="1060" font-size="78" font-weight="700">Earth Modeling</text>
  </g>
</svg>
